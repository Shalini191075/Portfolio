    // --- Matrix Dot Canvas Component ---
    function MatrixDotCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const mouse = {
          x: -1000,
          y: -1000,
          targetX: -1000,
          targetY: -1000,
          active: false,
          radius: 170,
        };

        const spacing = 36;
        let cols = Math.ceil(width / spacing) + 2;
        let rows = Math.ceil(height / spacing) + 2;
        let time = 0;

        const handleResize = () => {
          if (!canvas) return;
          const dpr = window.devicePixelRatio || 1;
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.scale(dpr, dpr);
          cols = Math.ceil(width / spacing) + 2;
          rows = Math.ceil(height / spacing) + 2;
        };

        handleResize();
        window.addEventListener('resize', handleResize);

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.targetX = e.clientX - rect.left;
          mouse.targetY = e.clientY - rect.top;
          mouse.active = true;
        };

        const handleMouseLeave = () => {
          mouse.targetX = -1000;
          mouse.targetY = -1000;
          mouse.active = false;
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        const render = () => {
          time += 0.025;
          mouse.x += (mouse.targetX - mouse.x) * 0.12;
          mouse.y += (mouse.targetY - mouse.y) * 0.12;

          ctx.fillStyle = '#0d1117';
          ctx.fillRect(0, 0, width, height);

          const vignette = ctx.createRadialGradient(
            width / 2, height * 0.4, 120,
            width / 2, height * 0.4, Math.max(width, height) * 0.85
          );
          vignette.addColorStop(0, 'rgba(16, 185, 129, 0.05)');
          vignette.addColorStop(0.5, 'rgba(13, 17, 23, 0.5)');
          vignette.addColorStop(1, '#0d1117');
          ctx.fillStyle = vignette;
          ctx.fillRect(0, 0, width, height);

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const originX = c * spacing;
              const originY = r * spacing;

              const waveX = Math.sin(time + r * 0.18 + c * 0.12) * 2.2;
              const waveY = Math.cos(time + c * 0.2 + r * 0.16) * 2.2;

              const dx = originX - mouse.x;
              const dy = originY - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              let posX = originX + waveX;
              let posY = originY + waveY;
              let dotRadius = 1.25;
              let alpha = 0.22;
              let color = '16, 185, 129';

              if (dist < mouse.radius) {
                const factor = 1 - dist / mouse.radius;
                const push = Math.sin(factor * Math.PI) * 16;
                const angle = Math.atan2(dy, dx);

                posX += Math.cos(angle) * push;
                posY += Math.sin(angle) * push;

                dotRadius = 1.25 + factor * 2.8;
                alpha = 0.3 + factor * 0.7;

                if (factor > 0.45) {
                  color = '163, 230, 53';
                }
              }

              ctx.beginPath();
              ctx.arc(posX, posY, dotRadius, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${color}, ${alpha})`;
              ctx.fill();

              if (dist < mouse.radius * 0.4) {
                ctx.beginPath();
                ctx.arc(posX, posY, dotRadius * 2.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(163, 230, 53, 0.18)';
                ctx.fill();
              }
            }
          }

          if (mouse.active && mouse.x > 0 && mouse.y > 0) {
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(163, 230, 53, 0.85)';
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 14;
            ctx.fill();
            ctx.shadowBlur = 0;
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0 block w-full h-full"
          style={{ background: '#0d1117' }}
        />
      );
    }

    // --- Interactive 3D Perspective Tilt Card ---
    function ProjectCard({ project }) {
      const cardRef = useRef(null);
      const [tiltStyle, setTiltStyle] = useState({});
      const [shineStyle, setShineStyle] = useState({ opacity: 0 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -8;
        const rotateY = ((x - centerX) / centerX) * 8;

        setTiltStyle({
          transform: `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-6px) scale3d(1.015, 1.015, 1.015)`,
          transition: 'transform 0.1s ease-out',
        });

        setShineStyle({
          opacity: 1,
          background: `radial-gradient(circle 260px at ${x}px ${y}px, rgba(16, 185, 129, 0.18), rgba(163, 230, 53, 0.08) 35%, transparent 75%)`,
        });
      };

      const handleMouseEnter = () => setIsHovered(true);

      const handleMouseLeave = () => {
        setIsHovered(false);
        setTiltStyle({
          transform: 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px) scale3d(1, 1, 1)',
          transition: 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)',
        });
        setShineStyle({ opacity: 0, transition: 'opacity 0.4s ease-out' });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          style={tiltStyle}
          className={`group relative rounded-2xl bg-[#131922]/85 backdrop-blur-xl border border-emerald-500/20 p-6 flex flex-col justify-between transition-shadow duration-300 transform-gpu overflow-hidden ${
            isHovered
              ? 'shadow-[0_15px_35px_-5px_rgba(16,185,129,0.28)] border-emerald-500/45'
              : 'shadow-[0_4px_20px_rgba(0,0,0,0.5)]'
          }`}
        >
          <div className="pointer-events-none absolute inset-0 rounded-2xl transition-opacity duration-300" style={shineStyle} />
          <div className="absolute top-0 left-6 right-6 h-[1px] bg-gradient-to-r from-transparent via-emerald-500/40 to-transparent group-hover:via-lime-400/60 transition-all duration-500" />

          <div>
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500/15 to-lime-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 group-hover:text-lime-300 group-hover:border-lime-400/50 transition-colors shadow-[0_0_15px_rgba(16,185,129,0.15)]">
                  {project.icon}
                </div>
                <span className="text-[11px] font-mono uppercase tracking-wider text-emerald-400/90 font-medium px-2 py-0.5 rounded bg-emerald-950/40 border border-emerald-500/20">
                  {project.subCategory}
                </span>
              </div>
              <span className="text-xs font-mono text-slate-500 group-hover:text-emerald-400 transition-colors">
                {project.id}
              </span>
            </div>

            <h3 className="text-xl font-bold text-white group-hover:text-emerald-300 transition-colors flex items-center justify-between gap-2">
              <span>{project.title}</span>
              <svg className="w-4 h-4 text-slate-500 group-hover:text-lime-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
