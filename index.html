    // --- Easter Egg: Custom Cursor Follower & Trailing Light Spark ---
    function CursorFollower() {
      const [pos, setPos] = useState({ x: -100, y: -100 });
      const [trailing, setTrailing] = useState({ x: -100, y: -100 });
      const [visible, setVisible] = useState(false);
      const [hovered, setHovered] = useState(false);

      useEffect(() => {
        let frameId;
        let targetX = -100;
        let targetY = -100;
        let currX = -100;
        let currY = -100;

        const onMouseMove = (e) => {
          targetX = e.clientX;
          targetY = e.clientY;
          setPos({ x: targetX, y: targetY });
          setVisible(true);

          const t = e.target;
          if (
            t &&
            (t.tagName === 'BUTTON' ||
              t.tagName === 'A' ||
              t.tagName === 'INPUT' ||
              t.tagName === 'TEXTAREA' ||
              t.closest('button') ||
              t.closest('a') ||
              t.classList.contains('cursor-pointer'))
          ) {
            setHovered(true);
          } else {
            setHovered(false);
          }
        };

        const onMouseLeave = () => setVisible(false);

        window.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseleave', onMouseLeave);

        const render = () => {
          currX += (targetX - currX) * 0.18;
          currY += (targetY - currY) * 0.18;
          setTrailing({ x: currX, y: currY });
          frameId = requestAnimationFrame(render);
        };
        render();

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseleave', onMouseLeave);
        };
      }, []);

      if (!visible) return null;

      return (
        <React.Fragment>
          {/* Outer Emerald Glowing Ring */}
          <div
            className="fixed pointer-events-none z-50 rounded-full hidden sm:block transform-gpu"
            style={{
              left: `${trailing.x}px`,
              top: `${trailing.y}px`,
              width: hovered ? '48px' : '30px',
              height: hovered ? '48px' : '30px',
              transform: 'translate(-50%, -50%)',
              border: hovered ? '1.5px solid rgba(163, 230, 53, 0.8)' : '1px solid rgba(16, 185, 129, 0.45)',
              backgroundColor: hovered ? 'rgba(16, 185, 129, 0.08)' : 'rgba(16, 185, 129, 0.02)',
              boxShadow: hovered
                ? '0 0 20px rgba(163, 230, 53, 0.4), inset 0 0 10px rgba(16, 185, 129, 0.2)'
                : '0 0 12px rgba(16, 185, 129, 0.25)',
              transition: 'width 0.2s ease, height 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease',
            }}
          />
          {/* Inner Lime Core Spark */}
          <div
            className="fixed pointer-events-none z-50 rounded-full hidden sm:block transform-gpu"
            style={{
              left: `${pos.x}px`,
              top: `${pos.y}px`,
              width: '5px',
              height: '5px',
              transform: 'translate(-50%, -50%)',
              backgroundColor: '#a3e635',
              boxShadow: '0 0 8px #a3e635, 0 0 14px #10b981',
            }}
          />
        </React.Fragment>
      );
    }

    // --- Matrix Dot Canvas Component ---
    function MatrixDotCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const mouse = {
          x: -1000,
          y: -1000,
          targetX: -1000,
          targetY: -1000,
          active: false,
          radius: 170,
        };

        const spacing = 36;
        let cols = Math.ceil(width / spacing) + 2;
        let rows = Math.ceil(height / spacing) + 2;
        let time = 0;

        const handleResize = () => {
          if (!canvas) return;
          const dpr = window.devicePixelRatio || 1;
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.scale(dpr, dpr);
          cols = Math.ceil(width / spacing) + 2;
          rows = Math.ceil(height / spacing) + 2;
        };

        handleResize();
        window.addEventListener('resize', handleResize);

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.targetX = e.clientX - rect.left;
          mouse.targetY = e.clientY - rect.top;
          mouse.active = true;
        };

        const handleMouseLeave = () => {
          mouse.targetX = -1000;
          mouse.targetY = -1000;
          mouse.active = false;
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        const render = () => {
          time += 0.025;
          mouse.x += (mouse.targetX - mouse.x) * 0.12;
          mouse.y += (mouse.targetY - mouse.y) * 0.12;

          ctx.fillStyle = '#0d1117';
          ctx.fillRect(0, 0, width, height);

          const vignette = ctx.createRadialGradient(
            width / 2, height * 0.4, 120,
            width / 2, height * 0.4, Math.max(width, height) * 0.85
          );
          vignette.addColorStop(0, 'rgba(16, 185, 129, 0.05)');
          vignette.addColorStop(0.5, 'rgba(13, 17, 23, 0.5)');
          vignette.addColorStop(1, '#0d1117');
          ctx.fillStyle = vignette;
          ctx.fillRect(0, 0, width, height);

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const originX = c * spacing;
              const originY = r * spacing;

              const waveX = Math.sin(time + r * 0.18 + c * 0.12) * 2.2;
              const waveY = Math.cos(time + c * 0.2 + r * 0.16) * 2.2;

              const dx = originX - mouse.x;
              const dy = originY - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              let posX = originX + waveX;
              let posY = originY + waveY;
              let dotRadius = 1.25;
              let alpha = 0.22;
              let color = '16, 185, 129';

              if (dist < mouse.radius) {
                const factor = 1 - dist / mouse.radius;
                const push = Math.sin(factor * Math.PI) * 16;
                const angle = Math.atan2(dy, dx);

                posX += Math.cos(angle) * push;
                posY += Math.sin(angle) * push;

                dotRadius = 1.25 + factor * 2.8;
                alpha = 0.3 + factor * 0.7;

                if (factor > 0.45) {
                  color = '163, 230, 53';
                }
              }

              ctx.beginPath();
              ctx.arc(posX, posY, dotRadius, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(${color}, ${alpha})`;
              ctx.fill();

              if (dist < mouse.radius * 0.4) {
                ctx.beginPath();
                ctx.arc(posX, posY, dotRadius * 2.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(163, 230, 53, 0.18)';
                ctx.fill();
              }
            }
          }

          if (mouse.active && mouse.x > 0 && mouse.y > 0) {
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(163, 230, 53, 0.85)';
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 14;
            ctx.fill();
            ctx.shadowBlur = 0;
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0 block w-full h-full"
          style={{ background: '#0d1117' }}
        />
      );
    }

    // --- Interactive 3D Tilt Project Card ---
    function ProjectCard({ project }) {
      const cardRef = useRef(null);
      const [tiltStyle, setTiltStyle] = useState({});
      const [shineStyle, setShineStyle] = useState({ opacity: 0 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -8;
        const rotateY = ((x - centerX) / centerX) * 8;

        setTiltStyle({
          transform: `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-6px) scale3d(1.015, 1.015, 1.015)`,
          transition: 'transform 0.1s ease-out',
        });

        setShineStyle({
          opacity: 1,
          background: `radial-gradient(circle 260px at ${x}px ${y}px, rgba(16, 185, 129, 0.18), rgba(163, 230, 53, 0.08) 35%, transparent 75%)`,
        });
      };

      const handleMouseEnter = () => setIsHovered(true);

      const handleMouseLeave = () => {
        setIsHovered(false);
        setTiltStyle({
          transform: 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px) scale3d(1, 1, 1)',
          transition: 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)',
        });
        setShineStyle({ opacity: 0, transition: 'opacity 0.4s ease-out' });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          style={tiltStyle}
          className={`group relative rounded-2xl bg-[#131922]/85 backdrop-blur-xl border border-emerald-500/20 p-6 flex flex-col justify-between transition-shadow duration-300 transform-gpu overflow-hidden ${
            isHovered
              ? 'shadow-[0_15px_35px_-5px_rgba(16,185,129,0.28)] border-emerald-500/45'
              : 'shadow-[0_4px_20px_rgba(0,0,0,0.5)]'
          }`}
        >
          <div className="pointer-events-none absolute inset-0 rounded-2xl transition-opacity duration-300" style={shineStyle} />

    // --- Interactive Magnetic Direct Link ---
    function MagneticLink({ href, label, subtitle, isExternal = true }) {
      const ref = useRef(null);
      const [pos, setPos] = useState({ x: 0, y: 0 });

      const onMouseMove = (e) => {
        if (!ref.current) return;
        const rect = ref.current.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        setPos({ x: (e.clientX - cx) * 0.2, y: (e.clientY - cy) * 0.2 });
      };

      const onMouseLeave = () => setPos({ x: 0, y: 0 });

      return (
        <a
          ref={ref}
          href={href}
          target={isExternal ? '_blank' : undefined}
          rel={isExternal ? 'noopener noreferrer' : undefined}
          onMouseMove={onMouseMove}
          onMouseLeave={onMouseLeave}
          style={{
            transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`,
            transition: pos.x === 0 && pos.y === 0 ? 'transform 0.4s ease' : 'none',
          }}
          className="flex items-center justify-between p-4 rounded-2xl bg-[#131922]/90 border border-emerald-500/20 hover:border-lime-400/60 shadow-[0_4px_20px_rgba(0,0,0,0.5)] transition-colors"
        >
          <div>
            <h4 className="text-sm font-bold text-white group-hover:text-emerald-300">{label}</h4>
            <p className="text-xs font-mono text-slate-400 truncate max-w-[220px] sm:max-w-[280px]">{subtitle}</p>
          </div>
          <span className="text-emerald-400">&rarr;</span>
        </a>
      );
    }

                <p className="text-xs text-slate-400 mb-6">Drop your details below and I will get back to you shortly.</p>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-mono font-medium text-slate-300 mb-2">YOUR NAME *</label>
                    <input
                      type="text"
                      required
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      placeholder="e.g. Alex Rivera"
                      disabled={status === 'loading'}
                      className="w-full px-4 py-3 rounded-xl bg-[#0d1117]/90 border border-emerald-500/25 focus:border-lime-400 focus:ring-1 focus:ring-lime-400 text-white placeholder-slate-500 text-sm outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-mono font-medium text-slate-300 mb-2">YOUR EMAIL *</label>
                    <input
                      type="email"
                      required
                      value={formData.email}
                      onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                      placeholder="e.g. alex@company.com"
                      disabled={status === 'loading'}
                      className="w-full px-4 py-3 rounded-xl bg-[#0d1117]/90 border border-emerald-500/25 focus:border-lime-400 focus:ring-1 focus:ring-lime-400 text-white placeholder-slate-500 text-sm outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-mono font-medium text-slate-300 mb-2">YOUR MESSAGE *</label>
                    <textarea
                      required
                      rows={4}
                      value={formData.message}
                      onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                      placeholder="Hi Shalini, I'd love to chat about..."
                      disabled={status === 'loading'}
                      className="w-full px-4 py-3 rounded-xl bg-[#0d1117]/90 border border-emerald-500/25 focus:border-lime-400 focus:ring-1 focus:ring-lime-400 text-white placeholder-slate-500 text-sm outline-none resize-none"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={status === 'loading' || status === 'success'}
                    className={`w-full py-4 px-6 rounded-xl font-bold text-sm sm:text-base flex items-center justify-center gap-2.5 transition-all duration-300 shadow-[0_0_20px_rgba(16,185,129,0.35)] ${
                      status === 'success'
                        ? 'bg-gradient-to-r from-emerald-500 to-lime-500 text-[#0d1117] shadow-[0_0_30px_rgba(163,230,53,0.5)] cursor-default'
                        : status === 'loading'
                        ? 'bg-emerald-600 text-[#0d1117] cursor-wait opacity-90'
                        : 'bg-gradient-to-r from-emerald-400 to-lime-400 hover:from-emerald-300 hover:to-lime-300 text-[#0d1117] hover:shadow-[0_0_35px_rgba(16,185,129,0.65)] hover:-translate-y-0.5 cursor-pointer'
                    }`}
                  >
                    {status === 'loading' && (
                      <React.Fragment>
                        <svg className="animate-spin -ml-1 mr-2 h-5 w-5 text-[#0d1117]" fill="none" viewBox="0 0 24 24">
                          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>Transmitting Message...</span>
                      </React.Fragment>
                    )}
                    {status === 'success' && <span>Message Sent! 🚀</span>}
                    {status === 'idle' && <span>Send Message</span>}
                  </button>
                </form>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // --- Footer Component ---
    function Footer() {
      return (
        <footer className="relative z-10 border-t border-emerald-500/20 py-10 px-4 text-center bg-[#070a0e]/95 backdrop-blur-md">
          <p className="text-xs sm:text-sm font-mono text-slate-300 tracking-wide">
            Designed &amp; Engineered by <strong className="text-emerald-400 font-semibold">Shalini S</strong> • Class of 2029
          </p>
          <p className="text-[11px] font-mono text-emerald-500/60 mt-1">
            Cyber-Emerald Edition • Bengaluru, India
          </p>
        </footer>
      );
    }

    // --- Main Unified App ---
    function App() {
      return (
        <div className="relative min-h-screen bg-[#0d1117] text-slate-100 font-sans selection:bg-emerald-500 selection:text-black">
          <CursorFollower />
          <MatrixDotCanvas />
          <Navbar />
          <main>
            <Hero />
            <FeaturedProjects />
            <TechStackSkills />
            <EducationJourney />
            <Contact />
          </main>
          <Footer />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
